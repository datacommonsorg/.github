name: Report Changed-Line Coverage
description: >-
  Prints diff-cover changed-line test coverage for pull requests. Report-only:
  always exits 0.

inputs:
  reports:
    description: >-
      Space-separated coverage report paths (Cobertura XML, LCOV, or JaCoCo XML)
      and any extra diff-cover arguments.
    required: true
  base-branch:
    description: Base branch of the pull request (empty skips reporting).
    required: false
    default: ""
  remote:
    description: Git remote to fetch the base branch from.
    required: false
    default: origin

runs:
  using: composite
  steps:
    - name: Report changed-line coverage
      shell: bash
      env:
        COVERAGE_BASE_BRANCH: ${{ inputs.base-branch }}
        COVERAGE_REMOTE: ${{ inputs.remote }}
        INPUT_REPORTS: ${{ inputs.reports }}
      run: |
        if [[ -d "$GITHUB_WORKSPACE/.venv/bin" ]]; then
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
        fi
        read -r -a args <<< "${INPUT_REPORTS//$'\n'/ }"
        "$GITHUB_ACTION_PATH/../../scripts/report_changed_lines.sh" "${args[@]}"
